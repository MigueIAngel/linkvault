name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkvault
          POSTGRES_PASSWORD: linkvault
          POSTGRES_DB: linkvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkvault"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://linkvault:linkvault@localhost:5432/linkvault
      AUTH_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Apply migrations and seed
        run: npx prisma migrate deploy && npx prisma db seed
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t linkvault .
